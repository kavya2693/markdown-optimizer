name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy

      - name: tests
        run: uv run pytest -q

      # Regenerates the dataset from its seed and reruns the full study; no network or model needed.
      - name: end-to-end run
        run: |
          uv run python scripts/generate_data.py
          uv run markdown-optimizer --out ci-outputs --draws 100

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build -t markdown-optimizer .
      - name: run the study in the image
        run: docker run --rm markdown-optimizer
