            el("line", { x1: px(v), x2: px(v), y1: PT, y2: PB, stroke: "rgba(178,191,204,0.1)", "stroke-width": 2 }, axes);
            const t = el("text", { x: px(v), y: PB + 32, "font-size": 20, fill: "#8494a6", "text-anchor": "middle" }, axes);
            t.textContent = v === 0 ? "0" : "−" + Math.abs(v);
          });
          [-6, -4, -2, 0].forEach((v) => {
            el("line", { x1: PL, x2: PR, y1: py(v), y2: py(v), stroke: "rgba(178,191,204,0.1)", "stroke-width": 2 }, axes);
            const t = el("text", { x: PL - 14, y: py(v) + 7, "font-size": 20, fill: "#8494a6", "text-anchor": "end" }, axes);
            t.textContent = v === 0 ? "0" : "−" + Math.abs(v);
          });
          const xl = el("text", { x: (PL + PR) / 2, y: PB + 62, "font-size": 20, fill: "#b2bfcc", "text-anchor": "middle" }, axes);
          xl.textContent = "true elasticity (known from the generator) →";
          const yl = el("text", { x: PL + 12, y: PT + 26, "font-size": 20, fill: "#b2bfcc" }, axes);
          yl.textContent = "↑ estimated";
          el("line", { x1: px(X0), y1: py(X0), x2: px(X1), y2: py(X1), stroke: "#3fd8a8", "stroke-width": 3, "stroke-dasharray": "10 8" }, axes);
          const dl = el("text", { x: px(0.15), y: py(0.15) - 18, "font-size": 20, fill: "#3fd8a8", "text-anchor": "end" }, axes);
          dl.textContent = "perfect estimate";
          const dots = el("g", { id: "running-dots" });
          const pts = DATA.pts.map((p, i) => ({ c: el("circle", { cx: px(p[0]), cy: py(p[1]), r: 5.5, fill: "#7fa8ff", "fill-opacity": 0.75 }, dots), p, i }));

          // phase 1: scatter, then every point moves from its own estimate to its pooled one
          tl.fromTo("#running-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#running-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#running-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo(["#running-chart", "#running-axes"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);
          pts.forEach(({ c, i }) => tl.fromTo(c, { attr: { r: 0 } }, { attr: { r: 5.5 }, duration: 0.3, ease: "power2.out" }, 0.7 + (i % 100) * 0.012 + Math.floor(i / 100) * 0.05));
          tl.fromTo("#running-side", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.0);
          tl.fromTo("#running-key", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.4);
          const M0 = 2.9, MD = 2.2;
          pts.forEach(({ c, p }) => tl.to(c, { attr: { cy: py(p[2]) }, fill: "#b9a2ff", duration: MD, ease: "power2.inOut" }, M0));
          const mae = { v: DATA.mae.no_pooling };
          const maeEl = document.getElementById("running-mae");
          tl.to(mae, { v: DATA.mae.partial_pooling, duration: MD, ease: "power2.inOut", onUpdate: () => { maeEl.textContent = mae.v.toFixed(3); } }, M0);
          tl.to("#running-mae", { color: "#b9a2ff", duration: MD }, M0);
          tl.to("#running-s1", { opacity: 0, duration: 0.4 }, M0 + 0.6);
          tl.fromTo("#running-s2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, M0 + 0.8);
          tl.fromTo("#running-few-b", { opacity: 0 }, { opacity: 1, duration: 0.4 }, M0 + MD - 0.2);
          tl.fromTo("#running-chip", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, M0 + MD + 0.2);

          // phase 2: margin per clearance event
          const evs = document.getElementById("running-evs");
          const max = Math.max(...DATA.events.map((e) => e.oracle));
          const START = { E1: "2026-01-26", E2: "2026-04-20", E3: "2026-07-13" };
          DATA.events.forEach((e, i) => {
            const bar = (k, cls, v) =>
              '<div class="bar-row"><div class="track"><div class="fill ' + cls + '" id="running-f' + i + k + '" style="width:' + ((960 * v) / max).toFixed(1) + 'px"></div></div>' +
              '<div class="val ' + cls + '">' + fmt(v) + "</div></div>";
            evs.insertAdjacentHTML("beforeend",
              '<div class="ev" id="running-ev' + i + '"><div class="who"><b>' + e.event_id + "</b><small>" + START[e.event_id] + "</small></div>" +
              '<div class="bars">' + bar("r", "rule", e.fixed_30) + bar("p", "plan", e.partial_pooling) + bar("o", "orc", e.oracle) + "</div></div>");
          });
          const P2 = 7.4;
          tl.to("#running-a", { opacity: 0.1, duration: 0.6, ease: "power2.inOut" }, P2);
          tl.to("#running-side", { opacity: 0, duration: 0.5 }, P2);
          tl.to("#running-title", { opacity: 0, duration: 0.3 }, P2);
          tl.fromTo("#running-card", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, P2 + 0.2);
          DATA.events.forEach((_, i) => {
            const at = P2 + 0.9 + i * 0.45;
            tl.fromTo("#running-ev" + i, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, at);
            ["r", "p", "o"].forEach((k, j) => tl.fromTo("#running-f" + i + k, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, at + 0.1 + j * 0.15));
          });
          tl.fromTo(["#running-legend2", "#running-total"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 2.6);
          const tot = { v: 0 }, totEl = document.getElementById("running-tot-b");
          const sum = DATA.events.reduce((s, e) => s + e.partial_pooling, 0);
          document.getElementById("running-tot-a").textContent = fmt(DATA.events.reduce((s, e) => s + e.fixed_30, 0));
          tl.to(tot, { v: sum, duration: 1.6, ease: "power2.out", onUpdate: () => { totEl.textContent = fmt(tot.v); } }, P2 + 2.8);
          tl.to("#running-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.4);
          window.__timelines["running"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
