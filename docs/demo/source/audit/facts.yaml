# Audit facts for the markdown-optimizer demo video.
# Read by docs/demo/source/tools/build_audit_report.py (paths below are relative to this file).
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: markdown-optimizer
  title: "markdown-optimizer: demo video audit report"
  repo_url: https://github.com/kavya2693/markdown-optimizer
  repo_dir: ../../../..
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 88.8
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [numpy, pandas]
  regenerate:
    - "make run                                   # data/ (seed 7) and outputs/*.csv, results.json, report.md (~10 s)"
    - "make sweep                                 # adds outputs/seed_sweep.csv (seeds 7-11)"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_markdown_sheet.py docs/demo/source/assets/markdown_sheet.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/markdown_sheet.json docs/demo/source/compositions/value.html --rows SKU0222,SKU0315,SKU0195,SKU0271,SKU0199,SKU0169 --animate SKU0222,SKU0315,SKU0195,SKU0271"
    - "python3 docs/demo/source/tools/inject_running.py . docs/demo/source/compositions/s04-running.html"
    - "python3 docs/demo/source/tools/plan_heatmap.py outputs/markdown_plan.csv docs/demo/source/assets/plan-heatmap.png"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/markdown-optimizer-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/markdown-optimizer-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data: 7, scorer: 11, demand_draws: 400}
  run_time: "make run (data + study, no sweep) took 9.9 s wall-clock on the author's laptop (Apple M1 Pro); the repo itself does not record a run time"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (400 SKUs in 12 categories, 156 weeks, three 4-week clearance events of 100 slow movers). The production data is proprietary."
    source: "src/markdown_optimizer/config.py:7-40; src/markdown_optimizer/data.py:168 (generate, seed=7); README 'The data'"
    figures: [F-03]
    all_figures: true
    edit: ["src/markdown_optimizer/config.py", "src/markdown_optimizer/data.py"]
    rerun: ["make data", "make run"]
  - id: A-02
    statement: "The generator and the estimator share the same constant-elasticity log-log demand form, so model misspecification costs nothing here. On real data elasticity usually rises with discount depth."
    source: "src/markdown_optimizer/data.py:49-69 (true_log_mu); src/markdown_optimizer/elasticity.py:1-13; README 'Known limitations' (biggest gap)"
    figures: [F-17, F-18, F-19, F-36, F-37, F-38, F-39, F-40, F-41, F-42, F-43, F-44, F-53, F-54, F-58, F-60, F-61, F-62, F-63, F-64]
    edit: ["src/markdown_optimizer/data.py:49-69"]
    rerun: ["make data", "make run"]
  - id: A-03
    statement: "A plan must reach 75% expected sell-through over the event; otherwise the path that sells the most is taken (fallback)."
    source: "src/markdown_optimizer/config.py:36 (sell_through_target = 0.75); src/markdown_optimizer/optimize.py:50-57 (choose)"
    figures: [F-16, F-25, F-45, F-51, F-56]
    edit: ["src/markdown_optimizer/config.py:36"]
    rerun: ["make run", "export_markdown_sheet.py + inject_sheet.py"]
  - id: A-04
    statement: "Leftover units at the end of an event go to a liquidator at 30% of unit cost."
    source: "src/markdown_optimizer/config.py:38 (salvage_share_of_cost = 0.30); data.py:265 (salvage_value)"
    figures: [F-11, F-17, F-18, F-19, F-20, F-43, F-44, F-46, F-47, F-53, F-58, F-60, F-61, F-62]
    edit: ["src/markdown_optimizer/config.py:38"]
    rerun: ["make data", "make run"]
  - id: A-05
    statement: "Markdown ladder: 0-60% in 10-point steps, 4 weeks per event, depth never goes back up, so every SKU-event has exactly 210 candidate paths, all scored."
    source: "src/markdown_optimizer/config.py:28 (LADDER), :34 (event_weeks = 4); src/markdown_optimizer/optimize.py:25-27 (ladder_paths)"
    figures: [F-09, F-10, F-14, F-22]
    edit: ["src/markdown_optimizer/config.py:28-34"]
    rerun: ["make run"]
  - id: A-06
    statement: "The business-as-usual baseline is 30% off every SKU for all four weeks."
    source: "src/markdown_optimizer/config.py:29 (FIXED_RULE_DEPTH = 0.30)"
    figures: [F-17, F-18, F-20, F-21, F-44, F-47, F-48, F-53, F-57, F-58, F-60, F-61, F-62]
    edit: ["src/markdown_optimizer/config.py:29"]
    rerun: ["make run"]
  - id: A-07
    statement: "Plans are scored on the true demand curve with 400 paired negative-binomial demand draws per SKU-event (scorer seed 11, size 40, about 16% noise on a high-volume SKU), using the competitor prices that actually happened."
    source: "src/markdown_optimizer/simulate.py:68-75 (draws=400, seed=11); data.py:22 (NB_SIZE = 40.0)"
    figures: [F-15, F-19, F-20, F-26, F-28, F-43, F-44, F-46, F-47, F-53, F-54, F-56, F-57, F-58, F-60, F-61, F-62, F-63, F-64]
    edit: ["src/markdown_optimizer/simulate.py:73-74", "src/markdown_optimizer/data.py:22"]
    rerun: ["make run"]
  - id: A-08
    statement: "When planning, the competitor price index is held at its last observed value and competitors do not react to our markdowns. The scorer uses the prices that actually happened."
    source: "src/markdown_optimizer/simulate.py:21-35 (model_demand); pipeline.py:73; README 'Known limitations'"
    figures: [F-33, F-19, F-44, F-53]
    edit: ["src/markdown_optimizer/simulate.py:21-35"]
    rerun: ["make run"]
  - id: A-09
    statement: "The planner optimises expected demand, not a demand quantile; noise pushes some events below the 75% line (90.6% of events hit it vs 92.1% for the 30% rule)."
    source: "src/markdown_optimizer/optimize.py:64-77; README 'Known limitations'"
    figures: [F-51, F-56, F-57]
    edit: ["src/markdown_optimizer/optimize.py"]
    rerun: ["make run"]
  - id: A-10
    statement: "No cannibalisation or halo between SKUs; one price zone at chain level."
    source: "README 'Known limitations'"
    figures: [F-19, F-44, F-53]
    edit: ["src/markdown_optimizer/data.py", "src/markdown_optimizer/simulate.py"]
    rerun: ["make data", "make run"]
  - id: A-11
    statement: "True own-price elasticities are drawn around category means of -1.2 to -2.9 with between-SKU spread 0.4 (capped at -0.4); competitors match our promotions 35% of the time."
    source: "src/markdown_optimizer/config.py:13-24; src/markdown_optimizer/data.py:110 (beta), :179 (match 0.35)"
    figures: [F-36, F-37, F-38, F-39, F-40, F-41]
    edit: ["src/markdown_optimizer/config.py:13-24", "src/markdown_optimizer/data.py:110"]
    rerun: ["make data", "make run"]
  - id: A-12
    statement: "Video rounding: margins to whole currency units with thousands separators, percentages to whole numbers or 1 decimal, elasticity MAE to 3 decimals, elasticities to 2 decimals; '~10 s' and '3 years' are rounded labels."
    source: "this audit (display convention)"
    figures: [F-13, F-19, F-20, F-21, F-36, F-37, F-38, F-39, F-40, F-43, F-44, F-46, F-47, F-50, F-51, F-53, F-54, F-55, F-56, F-57, F-58, F-60, F-61, F-62, F-63, F-64]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-13
    statement: "Slide 01 (industry, everyday problems) is general retail knowledge used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports all four problems"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]
  - id: A-14
    statement: "The 'make run ≈ 10 s' label is a single wall-clock measurement on the author's laptop (Apple M1 Pro), not a repo output; it varies with the machine."
    source: "measured for this audit (time .venv/bin/markdown-optimizer)"
    figures: [F-30]
    edit: ["compositions/s03-architecture.html (#arch-nfr)", "compositions/s07-end.html (#endcard-run)"]
    rerun: ["hyperframes render"]

figures:
