# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  from itertools import combinations_with_replacement as _cwr

  def n_paths():
      """Ladder paths per SKU-event from the rungs in config.py and the 4-week event length."""
      cfg = T('src/markdown_optimizer/config.py')
      rungs = _re.search(r'LADDER: tuple\[float, \.\.\.\] = \(([^)]*)\)', cfg).group(1).split(',')
      weeks = int(_re.search(r'event_weeks: int = (\d+)', cfg).group(1))
      return len(list(_cwr(range(len(rungs)), weeks)))

  def plan_row(event, sku):
      r = row('outputs/markdown_plan.csv', event_id=event, sku_id=sku)
      return (tuple(round(float(r[f'depth_w{w}']), 2) for w in range(1, 5)), round(float(r['margin'])), round(float(r['fixed_30_margin'])))

  def arch_boxes_exist():
      src = 'src/markdown_optimizer/'
      need = [
          ('scripts/generate_data.py', r'def main'), (src + 'data.py', r'def generate\('),
          (src + 'features.py', r'def prepare\('), (src + 'elasticity.py', r'def poisson_irls\('),
          (src + 'elasticity.py', r'def fit_robust\('), (src + 'elasticity.py', r'def shrink\('),
          (src + 'elasticity.py', r'def dersimonian_laird\('), (src + 'elasticity.py', r'def fit_controls\('),
          (src + 'simulate.py', r'def model_demand\('), (src + 'optimize.py', r'def ladder_paths\('),
          (src + 'optimize.py', r'def score_paths\('), (src + 'optimize.py', r'def choose\('),
          (src + 'lift.py', r'def evaluate_lift\('), (src + 'simulate.py', r'def simulate\('),
          (src + 'cli.py', r'def write_outputs\('), (src + 'cli.py', r'markdown_plan\.csv'),
          (src + 'cli.py', r'results\.json'), (src + 'cli.py', r'report\.md'),
          (src + 'data.py', r'truth" / "sku_params\.csv'), (src + 'data.py', r'future_competitor_index\.csv'),
      ]
      ok = all(grep(p, rx) for p, rx in need)
      files = ['data/sales.csv', 'data/events.csv', 'data/truth/sku_params.csv', 'outputs/markdown_plan.csv', 'outputs/results.json', 'outputs/report.md']
      return ok and all(len(T(f)) > 0 for f in files)

  def _block(path, name):
      html = T(path)
      m = _re.search(r'const ' + name + r' = (\{.*?\}); /\* ' + name + r':END', html, _re.S)
      return json.loads(m.group(1))

  def running_data_matches():
      """The DATA block in s04-running.html equals outputs/elasticity_by_sku.csv (rounded to 3 dp)."""
      d = _block('demo:compositions/s04-running.html', 'DATA')
      e = R('outputs/elasticity_by_sku.csv')
      w = e.pivot(index='sku_id', columns='estimator', values='beta_hat')
      t = e.drop_duplicates('sku_id').set_index('sku_id')['beta_true']
      want = [[round(float(t[s]), 3), round(float(w.at[s, 'no_pooling']), 3), round(float(w.at[s, 'partial_pooling']), 3)] for s in sorted(w.index)]
      return d['pts'] == want and len(want) == 400

  def event_bars_match():
      d = _block('demo:compositions/s04-running.html', 'DATA')
      for ev in d['events']:
          for p in ('fixed_30', 'partial_pooling', 'oracle'):
              if abs(ev[p] - float(row('outputs/markdown_by_event.csv', policy=p, event_id=ev['event_id'])['margin'])) > 0.006:
                  return False
      return [e['event_id'] for e in d['events']] == ['E1', 'E2', 'E3']

  def sheet_rows_match():
      """value.html SHEET rows == exported sheet == outputs/markdown_plan.csv (E1), and the event totals match."""
      sheet = _block('demo:compositions/value.html', 'SHEET')
      exp = {r['sku_id']: r for r in J('demo:assets/markdown_sheet.json')['rows']}
      plan = R('outputs/markdown_plan.csv').query('event_id == "E1"').set_index('sku_id')
      el = R('outputs/elasticity_by_sku.csv').query('estimator == "partial_pooling"').set_index('sku_id')['beta_hat']
      ev = R('data/events.csv').query('event_id == "E1"').set_index('sku_id')
      for r in sheet['rows']:
          s = r['sku_id']
          x, p = exp[s], plan.loc[s]
          if any(r[k] != x[k] for k in ('depths', 'margin', 'fixed_30_margin', 'planned_sell_through', 'opening_stock', 'elasticity')):
              return False
          if r['depths'] != [round(float(p[f'depth_w{w}']), 2) for w in range(1, 5)]:
              return False
          if abs(r['margin'] - p['margin']) > 0.006 or abs(r['fixed_30_margin'] - p['fixed_30_margin']) > 0.006:
              return False
          if abs(r['planned_sell_through'] - p['planned_sell_through']) > 0.0001 or r['opening_stock'] != int(ev.at[s, 'opening_stock']):
              return False
          if abs(r['elasticity'] - el[s]) > 0.0006:
              return False
      by = R('outputs/markdown_by_event.csv')
      tot_ok = abs(sheet['margin'] - float(by.query('policy == "partial_pooling" and event_id == "E1"')['margin'].iat[0])) < 0.01
      tot_ok = tot_ok and abs(sheet['fixed_30_margin'] - float(by.query('policy == "fixed_30" and event_id == "E1"')['margin'].iat[0])) < 0.01
      return tot_ok and [r['sku_id'] for r in sheet['rows']] == ['SKU0222', 'SKU0315', 'SKU0195', 'SKU0271', 'SKU0199', 'SKU0169']
