  - {id: F-02, slides: ["01"], label: "Four everyday problems (overbought stock; blanket discount; too deep gives margin away; too shallow leaves leftovers for a liquidator)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem'", key: "README lines 13-27", formula: "-",
     check: {expr: "grep('README.md', r'overbought') and grep('README.md', r'30% off everything') and grep('README.md', r'gives away margin') and grep('README.md', r'liquidator')", fmt: bool}}
  # ---- slide 02
